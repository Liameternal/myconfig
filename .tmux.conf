# get tpm installed
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm 

###############################################################################
#                           tmux_status_line_CUS
###############################################################################
# auto rename windows name
set -g automatic-rename on

# set start index of window from 1
set -g base-index 1

set -g status on

# Refresh 'status-left' and 'status-right' more often, from every 15s to 1s
set -g status-interval 1

###############################################################################
#                           tmux DIY
###############################################################################
# set shell
set -g default-shell /bin/zsh

#
set -g default-command zsh

# enable mouse
set-option -g mouse off

# Restoring Clear Screen
bind C-l send-keys 'C-l'

# better splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim-like key-binding in cope-mode and command-prompt-mode
set -g mode-keys vi
set -g status-keys vi

# send command to all panes !!! update bashrc or others
bind C-x command-prompt -p "To all panes in all windows in all sessions Command:" \
         "run \"tmux list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
               | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# send command to all windows, if a windows with multiple panes, send command to the current pane
# bind C-e command-prompt -p "To all windows in current session Command:" \
         "run \"tmux list-panes -s -F '##{session_name}:##{window_index}' \
                | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# new window from the current dir and with a prompt name
bind c command-prompt -p "window name:"\
       "run \"tmux new-window -c '#{pane_current_path}' -n '%1'\""

# send pane to specific session:window.pane
bind-key m command-prompt -p "send pane to: [session:default_current]:window.pane"  "join-pane -t '%%'"
bind-key M choose-tree -Zw "join-pane -t '%%'"
bind-key C-m choose-tree -Zs "join-pane -t '%%'"

###############################################################################
#                           plugins
###############################################################################
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# set tmux theme to dracula
# must put before tmux-resurrect and tmux-continuum
set -g @plugin 'dracula/tmux'

# navigate like vim
set -g @plugin 'christoomey/vim-tmux-navigator'

# autorestore tmux workspace even vim workspace
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Lightweight tmux utilities for manipulating tmux sessions
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Tmux Logging
set -g @plugin 'tmux-plugins/tmux-logging'


###############################################################################
#                           tmux-sensible
###############################################################################
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 1s
set -g display-time 1000

# Upgrade $TERM
set -g default-terminal "xterm-256color"

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# set bind-key to C-a
set -g prefix C-a
bind C-a send-prefix

# Source .tmux.conf as suggested in `man tmux`
bind-key R source-file ~/.tmux.conf \; \
                   display-message "source-file done"

###############################################################################
#                           tmux-resurrect
###############################################################################

# restore vim sessions if Session.vim file is present.
set -g @resurrect-strategy-vim 'session'


###############################################################################
#                           tmux-continuum
###############################################################################
# set save interval(minutes)
set -g @continuum-save-interval '15'

# Last saved environment is automatically restored when tmux is started
set -g @continuum-restore 'on'

# Tmux is automatically started after the computer/server is turned on
# comment this if you are in desktop environments, to avoid problem https://github.com/tmux-plugins/tmux-continuum/issues/129
# set -g @continuum-boot 'on'

# set -g status-right 'Continuum status: #{continuum_status}'

###############################################################################
#                           dracula
###############################################################################
# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, playerctl, kubernetes-context, synchronize-panes
set -g @dracula-plugins "git network-bandwidth ram-usage cpu-usage "
# available colors: white, gray, dark_gray, light_purple, dark_purple, cyan, green, orange, red, pink, yellow
# set -g @dracula-[plugin-name]-colors "[background] [foreground]"
set -g @dracula-cpu-usage-colors "red gray"
set -g @dracula-ram-usage-colors ""
set -g @dracula-network-bandwidth-colors "yellow dark_gray"
set -g @dracula-kubernetes-context-colors "white dark_gray"

# Enable powerline symbols
set -g @dracula-show-powerline true

# for left
set -g @dracula-show-left-sep ""

# for right symbol (can set any symbol you like as separator)
set -g @dracula-show-right-sep ""

set -g @dracula-show-flags true

# it can accept `hostname` (full hostname), `session`, `shortname` (short name), `smiley`, `window`, or any character.
set -g @dracula-show-left-icon session

# Add padding to the left smiley icon
# default is 1, it can accept any number and 0 disables padding.
set -g @dracula-left-icon-padding 1
# Hide empty plugins
set -g @dracula-show-empty-plugins false

###############################################################################
#                           tmux-sessionist
###############################################################################
# prefix + g - prompts for session name and switches to it. Performs 'kind-of' name completion.
# Faster than the built-in prefix + s prompt for long session lists.
#
# prefix + C (shift + c) - prompt for creating a new session by name.
#
# prefix + X (shift + x) - kill current session without detaching tmux.
#
# prefix + S (shift + s) - switches to the last session.
# The same as built-in prefix + L that everyone seems to override with some other binding.
#
# prefix + @ - promote current pane into a new session.
# Analogous to how prefix + ! breaks current pane to a new window.
#
# prefix + ctrl-@ - promote current window into a new session.
#
# prefix + t<secondary-key> - join currently marked pane (prefix + m) to current session/window, and switch to it
# secondary-keys
# h, -, ": join horizontally
# v, |, %: join vertically
# f, @: join full screen


###############################################################################
#                           tmux logging
###############################################################################

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
